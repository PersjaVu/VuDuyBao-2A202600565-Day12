services:
  - type: web
    name: legal-multiagent
    runtime: docker
    region: singapore
    plan: free
    rootDir: 06-lab-complete

    healthCheckPath: /health
    autoDeploy: true

    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: REGISTRY_URL
        value: http://localhost:19000
      - key: CUSTOMER_AGENT_URL
        value: http://127.0.0.1:19100
      - key: AGENT_API_KEY
        generateValue: true
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: MONTHLY_REQUEST_LIMIT
        value: "500"
      - key: OPENROUTER_MODEL
        value: anthropic/claude-haiku-3-5
      - key: REDIS_URL
        fromService:
          type: redis
          name: legal-agent-redis
          property: connectionString
      - key: OPENROUTER_API_KEY
        sync: false

  - type: redis
    name: legal-agent-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
