name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────────────────
  # Job 1: Lint + Test
  # ──────────────────────────────────────────────────────────
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 06-final-project

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: 06-final-project/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          pip install ruff
          ruff check app/ utils/ --select E,W,F --ignore E501

      - name: Test
        env:
          AGENT_API_KEY: test-key-12345
          ENVIRONMENT: test
          REDIS_URL: ""
          MONTHLY_BUDGET_USD: "10.0"
          RATE_LIMIT_PER_MINUTE: "10"
        run: python -m pytest tests/ -v --tb=short

  # ──────────────────────────────────────────────────────────
  # Job 2: Docker build smoke-test
  # ──────────────────────────────────────────────────────────
  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: 06-final-project

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Build Docker image
        run: docker build -t ai-agent-test:${{ github.sha }} .

      - name: Smoke-test
        run: |
          docker run -d --name smoke -p 8000:8000 \
            -e AGENT_API_KEY=smoke-key \
            -e ENVIRONMENT=test \
            -e REDIS_URL="" \
            ai-agent-test:${{ github.sha }}
          sleep 8
          curl -f http://localhost:8000/health || (docker logs smoke && exit 1)
          docker stop smoke

  # ──────────────────────────────────────────────────────────
  # Job 3: Trigger Render deploy (only on main push, after CI passes)
  # ──────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render deploy hook
        run: |
          HOOK="${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_URL not set — skipping deploy trigger"
            exit 0
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$HOOK")
          echo "Render response: $STATUS"
          [[ "$STATUS" =~ ^2 ]] || (echo "Unexpected status $STATUS" && exit 1)
