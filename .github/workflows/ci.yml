# ============================================================
# CI Pipeline — runs on every push and pull request
#
# Jobs:
#   1. test  — lint + unit tests (blocks deploy if fails)
#   2. build — docker build smoke-test (blocks deploy if fails)
#   3. deploy-notify — triggers Render deploy only when CI passes
# ============================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: 06-final-project

jobs:
  # ──────────────────────────────────────────────────────────
  # Job 1: Lint + Test
  # ──────────────────────────────────────────────────────────
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: 06-final-project/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check app/ utils/ --select E,W,F --ignore E501

      - name: Run tests
        env:
          AGENT_API_KEY: test-key-12345
          ENVIRONMENT: test
          REDIS_URL: ""
          MONTHLY_BUDGET_USD: "10.0"
          RATE_LIMIT_PER_MINUTE: "10"
        run: python -m pytest tests/ -v --tb=short

  # ──────────────────────────────────────────────────────────
  # Job 2: Docker build smoke-test
  # ──────────────────────────────────────────────────────────
  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test  # only run if tests pass

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ai-agent-test:${{ github.sha }} .

      - name: Smoke-test container health
        run: |
          docker run -d \
            --name smoke \
            -p 8000:8000 \
            -e AGENT_API_KEY=smoke-key \
            -e ENVIRONMENT=test \
            -e REDIS_URL="" \
            ai-agent-test:${{ github.sha }}
          sleep 5
          curl -f http://localhost:8000/health || (docker logs smoke && exit 1)
          docker stop smoke

  # ──────────────────────────────────────────────────────────
  # Job 3: Trigger Render deploy (only on main, only if CI passes)
  # ──────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render deploy
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
        # Set RENDER_DEPLOY_HOOK_URL in GitHub repo:
        # Settings → Secrets → Actions → New repository secret
